services:
  portal:
    build: .
    env_file: .env
    ports:
      - '8081:8081'
    volumes:
      - portal_attachments:/srv/data/attachments
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/healthz")']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portal_attachments:
